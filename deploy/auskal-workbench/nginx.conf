server {
  listen 80;
  server_name dev.auskal.tech;
  location ^~ /.well-known/acme-challenge/ { root /var/www/rea-acme; try_files $uri =404; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  server_name dev.auskal.tech;
  ssl_certificate /etc/letsencrypt/live/dev.auskal.tech/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dev.auskal.tech/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  client_max_body_size 70m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Strict-Transport-Security "max-age=86400" always;
  location / {
    proxy_pass http://172.16.4.2:3180;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header X-REA-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 150s;
  }
}
